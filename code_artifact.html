            "https://images.unsplash.com/photo-1561948955-570b270e7c36?w=600&auto=format&fit=crop&q=80",
            "https://images.unsplash.com/photo-1543852786-1cf6624b9987?w=600&auto=format&fit=crop&q=80",
            "https://images.unsplash.com/photo-1518791841217-8f162f1e1131?w=600&auto=format&fit=crop&q=80",
            "https://images.unsplash.com/photo-1533743983669-94fa5c4338ec?w=600&auto=format&fit=crop&q=80",
            "https://images.unsplash.com/photo-1574158622682-e40e69881006?w=600&auto=format&fit=crop&q=80",
            "https://images.unsplash.com/photo-1513360371669-4adf3dd7dff8?w=600&auto=format&fit=crop&q=80",
            "https://images.unsplash.com/photo-1592194996308-7b43878e84a6?w=600&auto=format&fit=crop&q=80",
            "https://images.unsplash.com/photo-1577023311546-acd0767731f0?w=600&auto=format&fit=crop&q=80"
        ];

        /**
         * Deterministic Hash Algorithm (FNV-1a variant)
         * Guarantees that exact same Name + Birthdate input produces 100% same hash output every single time.
         */
        function hashString(str) {
            let hash = 2166136261;
            for (let i = 0; i < str.length; i++) {
                hash ^= str.charCodeAt(i);
                hash += (hash << 1) + (hash << 4) + (hash << 7) + (hash << 8) + (hash << 24);
            }
            return Math.abs(hash);
        }

        function calculateCat(event) {
            event.preventDefault();
            
            const name = document.getElementById('userName').value.trim();
            const birth = document.getElementById('userBirth').value;

            if (!name || !birth) return;

            // Show loading animation
            document.getElementById('inputSection').classList.add('hidden');
            document.getElementById('loadingSection').classList.remove('hidden');

            // Seed based on combination
            const seedKey = `${name.toLowerCase()}_${birth}`;
            const baseHash = hashString(seedKey);

            // Calculate deterministic indices
            const breedIndex = baseHash % CAT_BREEDS.length;
            const patternIndex = Math.floor(baseHash / 3) % COAT_PATTERNS.length;
            const householdIndex = Math.floor(baseHash / 7) % HOUSEHOLDS.length;
            const imageIndex = Math.floor(baseHash / 11) % CAT_IMAGES.length;

            const breedObj = CAT_BREEDS[breedIndex];
            const patternObj = COAT_PATTERNS[patternIndex];
            const householdObj = HOUSEHOLDS[householdIndex];
            const catImgUrl = CAT_IMAGES[imageIndex];

            // Simulate calculation delay for playful interactive feel
            setTimeout(() => {
                // Populate Result Elements
                document.getElementById('resultUserTag').innerText = `${name} 的命定貓咪身份`;
                document.getElementById('resultCatTitle').innerText = `${patternObj.name} ${breedObj.name}`;
                document.getElementById('resultHome').innerText = householdObj;
                document.getElementById('resultDesc').innerText = `${breedObj.traits} 在你的命定環境中，更添一份自在與愜意。`;
                document.getElementById('patternBadge').innerText = `✨ 特質：${patternObj.badge}`;
                document.getElementById('resultCatImg').src = catImgUrl;

                // Dynamically update card background based on calculated coat pattern
                const resultCard = document.getElementById('resultCard');
                resultCard.className = `rounded-3xl p-6 sm:p-8 shadow-2xl relative border-4 border-white/80 overflow-hidden transition-all duration-700 animate-popIn ${patternObj.bgStyle}`;
                
                // Adjust text colors if background is dark
                if (patternObj.dark) {
                    document.getElementById('resultCatTitle').className = "text-2xl sm:text-3xl font-black text-white tracking-wide mt-1";
                } else {
                    document.getElementById('resultCatTitle').className = "text-2xl sm:text-3xl font-black text-slate-800 tracking-wide mt-1";
                }

                // Switch Views
                document.getElementById('loadingSection').classList.add('hidden');
                const resultSec = document.getElementById('resultSection');
                resultSec.classList.remove('hidden');
                setTimeout(() => {
                    resultSec.classList.remove('opacity-0', 'translate-y-4');
                }, 50);

                // Create playful celebratory paw prints
                spawnCelebrationPaws();

            }, 1200);
        }

        function resetTest() {
            const resultSec = document.getElementById('resultSection');
            resultSec.classList.add('opacity-0', 'translate-y-4');
            setTimeout(() => {
                resultSec.classList.add('hidden');
                document.getElementById('inputSection').classList.remove('hidden');
            }, 300);
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = message;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2500);
        }

        function shareResult() {
            const name = document.getElementById('userName').value.trim();
            const catTitle = document.getElementById('resultCatTitle').innerText;
            const home = document.getElementById('resultHome').innerText;
            
            const shareText = `【你是哪一種貓？心理測驗】\n🐾 經測算 ${name} 的命定貓咪是：「${catTitle}」！\n🏠 命定家庭：${home}\n快來測測看你是哪種貓咪吧！`;

            if (navigator.clipboard) {
                navigator.clipboard.writeText(shareText).then(() => {
                    showToast("已成功複製測試結果至剪貼簿！");
                }).catch(() => {
                    fallbackCopy(shareText);
                });
            } else {
                fallbackCopy(shareText);
            }
        }

        function fallbackCopy(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            document.body.appendChild(textArea);
            textArea.select();
            document.execCommand('copy');
            document.body.removeChild(textArea);
            showToast("已成功複製測試結果至剪貼簿！");
        }

        // Paw print interaction on click/tap
        document.addEventListener('click', function(e) {
            // Don't trigger paw print on buttons to keep clicks clean
            if (e.target.closest('button') || e.target.closest('input')) return;

            createPawAt(e.clientX, e.clientY);
        });

        function createPawAt(x, y) {
            const paw = document.createElement('div');
            paw.className = 'paw-print';
            paw.innerHTML = '<i class="fa-solid fa-paw text-2xl"></i>';
            paw.style.left = `${x - 12}px`;
            paw.style.top = `${y - 12}px`;
            
            // Random slight rotation
            const rot = (Math.random() * 40) - 20;
            paw.style.transform = `scale(0.6) rotate(${rot}deg)`;
            
            document.body.appendChild(paw);

            requestAnimationFrame(() => {
                paw.style.transform = `scale(1) rotate(${rot}deg) translateY(-10px)`;
                paw.style.opacity = '0';
            });

            setTimeout(() => {
                paw.remove();
            }, 800);
        }

        function spawnCelebrationPaws() {
            for (let i = 0; i < 8; i++) {
                setTimeout(() => {
                    const x = Math.random() * (window.innerWidth - 60) + 30;
                    const y = Math.random() * (window.innerHeight - 60) + 30;
                    createPawAt(x, y);
                }, i * 150);
            }
        }

        // Set default max date for birthday picker (today)
        window.addEventListener('DOMContentLoaded', () => {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('userBirth').setAttribute('max', today);
        });
    </script>
